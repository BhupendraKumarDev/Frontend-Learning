
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Paws - Pet Adoption</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <img src="https://pet-adoption-form-03.vercel.app/images/puppy-6.jpg" alt="Pet Adoption" class="pet-image">

            <h1>🐾 HAPPY PAWS</h1>

            <p class="tagline">
                Find Your Forever Friend 💗
            </p>

            <p class="footer-text">
                Love • Care • Adopt
            </p>

        </div>

        <!-- Right Section -->
        <div class="right-section">

            <h2>Pet Adoption Registration</h2>

            <form>

                <div class="form-group">
                    <label for="adopter-name">Adopter Name</label>
                    <input id="adopter-name" name="name" type="text" placeholder="Enter Your Name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input id="password" name="password" type="password" placeholder="Create Password" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="instagram">Instagram Profile</label>
                    <input id="instagram" name="instagram" type="url" placeholder="https://instagram.com/username">
                </div>

                <div class="form-group">
                    <label for="preferred-pet">Preferred Pet</label>
                    <input id="preferred-pet" name="preferred-pet" type="text" placeholder="Search Your Pet" required>
                </div>

                <div class="form-group">
                    <label for="home-size">Home Size (Sq.ft)</label>
                    <input id="home-size" name="home-size" type="number" min="0" value="800">
                </div>

                <div class="form-group">
                    <label>Application ID</label>
                    <input type="text" value="ADP2026" readonly>
                </div>

                <div class="form-group">
                    <label>Application Status</label>
                    <input type="text" value="Pending Verification" readonly>
                </div>

                <button type="submit">
                    🐾 Adopt Now
                </button>

            </form>

        </div>

    </div>

</body>
</html>
