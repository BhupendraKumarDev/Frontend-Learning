
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Paws - Pet Adoption</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <img src="https://pet-adoption-form-03.vercel.app/images/puppy-6.jpg" alt="Pet Adoption" class="pet-image">

            <h1>🐾 HAPPY PAWS</h1>

            <p class="tagline">
                Find Your Forever Friend 💗
            </p>

            <p class="footer-text">
                Love • Care • Adopt
            </p>

        </div>

        <!-- Right Section -->
        <div class="right-section">

            <h2>Pet Adoption Registration</h2>

            <form>

                <div class="form-group">
                    <label>Adopter Name</label>
                    <input type="text" placeholder="Enter Your Name" required>
                </div>

                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" placeholder="Create Password" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label>Instagram Profile</label>
                    <input type="url" placeholder="https://instagram.com/username">
                </div>

                <div class="form-group">
                    <label>Preferred Pet</label>
                    <input type="text" placeholder="Search Your Pet" required>
                </div>

                <div class="form-group">
                    <label>Home Size (Sq.ft)</label>
                    <input type="number" value="800">
                </div>

                <div class="form-group">
                    <label>Application ID</label>
                    <input type="text" value="ADP2026" readonly>
                </div>

                <div class="form-group">
                    <label>Application Status</label>
                    <input type="text" value="Pending Verification" readonly>
                </div>

                <button type="submit">
                    🐾 Adopt Now
                </button>

            </form>

        </div>

    </div>

</body>
</html>
