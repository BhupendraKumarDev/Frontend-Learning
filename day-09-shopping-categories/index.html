
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Categories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav aria-label="Shop categories">
        <a href="#electronics">Electronics</a>
        <a href="#kids">Kids Fashion</a>
        <a href="#women">Women Fashion</a>
    </nav>

    <main>
        <section id="electronics">
            <h2>Electronics</h2>

            <div class="products">
                <article class="card">Wireless Headphones</article>
                <article class="card">Smart Watch</article>
                <article class="card">Bluetooth Speaker</article>
            </div>
        </section>

        <section id="kids">
            <h2>Kids Fashion</h2>

            <div class="products">
                <article class="card">Cotton T-shirt</article>
                <article class="card">Denim Overalls</article>
                <article class="card">Colorful Sneakers</article>
            </div>
        </section>

        <section id="women">
            <h2>Women Fashion</h2>

            <div class="products">
                <article class="card">Everyday Tote</article>
                <article class="card">Classic Jacket</article>
                <article class="card">Summer Dress</article>
            </div>
        </section>
    </main>

</body>
</html>
