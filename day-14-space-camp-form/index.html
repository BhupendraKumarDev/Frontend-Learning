<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Camp Explorer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
        <section class="main">
            <h1>🚀 SPACE CAMP</h1>
        <p>Reach Beyond the Stars • Train Like an Astronaut</p>
    </section>
    <section class="Image">
        <img src="https://space-camp-form-03.vercel.app/images/astronot.jpg" alt="Astronaut preparing for a space mission">
    </section>
    <form>
         <h3>Explorer Registration Form</h3>
  <div class="container">
     <div class="box">
     <label for="name">Explorer name</label>
    <input type="text" name="Name" id="name" placeholder="Enter Explorer Name" autocomplete="name" required>
   </div>
   <div class="box">
     <label for="password">Password</label>
    <input type="password" placeholder="Create Password" name="Password" id="password" autocomplete="new-password" required>
   </div>
  </div>
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="10" max="99" value="18" required>
    <label for="fitness">Fitness Score</label>
    <input type="range" id="fitness" name="fitness" min="0" max="100" value="50">
    <label for="camp-date">Camp Date</label>
    <input type="date" id="camp-date" name="camp-date" required>
    <button type="submit">Register for camp</button>
        
    </form>
</body>
</html>
